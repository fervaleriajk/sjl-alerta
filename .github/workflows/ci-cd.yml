name: CI/CD — SJL Alerta
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Instalar y compilar
        run: |
          npm ci --prefix api
          npm ci --prefix web
          npm run build --prefix web
          test -f web/dist/staticwebapp.config.json
      - name: Ejecutar las pruebas
        run: npm test --prefix api
      - name: Auditar las dependencias
        run: |
          npm audit --prefix api --audit-level=high
          npm audit --prefix web --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analizar código con Semgrep
        run: |
          python -m pip install semgrep==1.186.0
          semgrep scan --config p/javascript --error --metrics=off --disable-version-check api/src web/src
      - name: Buscar secretos con Gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact --exit-code 1 /repo
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SWA_URL != ''
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: swa-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Desplegar en Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: web
          api_location: api
          output_location: dist
          production_branch: main
      - name: Verificar sitio y almacenamiento
        shell: bash
        env:
          SWA_URL: ${{ vars.SWA_URL }}
        run: |
          set -o pipefail
          curl -fsS --retry 6 --retry-all-errors --max-time 20 "$SWA_URL/" >/dev/null
          curl -fsS --retry 6 --retry-all-errors --max-time 20 "$SWA_URL/api/health" |
            jq -e '.status == "ok"'
